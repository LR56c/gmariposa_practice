<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Órdenes</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the saved theme before first paint to avoid a light flash (mirrors ThemeService).
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        // Storage blocked: stay on the light theme until the app starts.
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
